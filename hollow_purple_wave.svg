<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 230" width="1180" height="230" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap');
      
      .font-sans { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes wave-travel {
        0% { transform: translateX(-150px) scaleX(0.2); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 1; }
        100% { transform: translateX(1250px) scaleX(1.8); opacity: 0; }
      }
      @keyframes purple-orb-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px #A855F7); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 28px #C084FC); }
      }
      @keyframes chant-fade-1 {
        0%, 100% { opacity: 0.2; transform: translateY(0px); }
        15%, 35% { opacity: 1; transform: translateY(-2px); filter: drop-shadow(0 0 8px #00F0FF); }
      }
      @keyframes chant-fade-2 {
        0%, 100% { opacity: 0.2; transform: translateY(0px); }
        35%, 55% { opacity: 1; transform: translateY(-2px); filter: drop-shadow(0 0 8px #F43F5E); }
      }
      @keyframes chant-fade-3 {
        0%, 100% { opacity: 0.2; transform: translateY(0px); }
        55%, 75% { opacity: 1; transform: translateY(-2px); filter: drop-shadow(0 0 8px #A855F7); }
      }
      @keyframes chant-fade-4 {
        0%, 100% { opacity: 0.2; transform: translateY(0px); }
        75%, 95% { opacity: 1; transform: translateY(-2px); filter: drop-shadow(0 0 12px #C084FC); }
      }
      @keyframes blast-line {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }

      .anim-wave-main { animation: wave-travel 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
      .anim-wave-fast { animation: wave-travel 4s cubic-bezier(0.2, 0.8, 0.4, 1) 0.15s infinite; }
      .anim-orb { animation: purple-orb-pulse 2.2s ease-in-out infinite; transform-origin: 75px 115px; }
      .chant-1 { animation: chant-fade-1 8s ease-in-out infinite; }
      .chant-2 { animation: chant-fade-2 8s ease-in-out infinite; }
      .chant-3 { animation: chant-fade-3 8s ease-in-out infinite; }
      .chant-4 { animation: chant-fade-4 8s ease-in-out infinite; }
      .anim-blast { stroke-dasharray: 400 400; animation: blast-line 2s linear infinite; }
    </style>

    <!-- Deep Space Multi-Stop Gradients -->
    <radialGradient id="waveBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#090518" />
      <stop offset="100%" stop-color="#020108" />
    </radialGradient>

    <!-- Hollow Purple Beam Gradients -->
    <linearGradient id="purpleBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="1" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="hollowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0" />
    </radialGradient>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="1180" height="230" rx="16" fill="url(#waveBg)" stroke="rgba(168,85,247,0.3)" stroke-width="1.2" />

  <!-- Grid Pattern (Cursed Energy Resonance Matrix) -->
  <g opacity="0.15">
    <line x1="0" y1="45" x2="1180" y2="45" stroke="#FFFFFF" stroke-dasharray="4 8" />
    <line x1="0" y1="90" x2="1180" y2="90" stroke="#FFFFFF" stroke-dasharray="4 8" />
    <line x1="0" y1="140" x2="1180" y2="140" stroke="#FFFFFF" stroke-dasharray="4 8" />
    <line x1="0" y1="185" x2="1180" y2="185" stroke="#FFFFFF" stroke-dasharray="4 8" />
  </g>

  <!-- ========================================================================= -->
  <!-- HOLLOW PURPLE CHANT INCANTATION SEQUENCE (TOP ROW)                        -->
  <!-- ========================================================================= -->
  <g class="font-mono" transform="translate(40, 36)" font-size="12" font-weight="700">
    <!-- Chant 1: Nine Ropes -->
    <g class="chant-1">
      <text x="0" y="0" fill="#00F0FF">九綱 [NINE ROPES]</text>
    </g>
    <!-- Arrow -->
    <text x="180" y="0" fill="rgba(255,255,255,0.25)">→</text>

    <!-- Chant 2: Polarized Light -->
    <g class="chant-2" transform="translate(210, 0)">
      <text x="0" y="0" fill="#F43F5E">偏光 [POLARIZED LIGHT]</text>
    </g>
    <!-- Arrow -->
    <text x="440" y="0" fill="rgba(255,255,255,0.25)">→</text>

    <!-- Chant 3: Crow and Declaration -->
    <g class="chant-3" transform="translate(470, 0)">
      <text x="0" y="0" fill="#A855F7">烏と声明 [CROW &amp; DECLARATION]</text>
    </g>
    <!-- Arrow -->
    <text x="760" y="0" fill="rgba(255,255,255,0.25)">→</text>

    <!-- Chant 4: Between Front and Back -->
    <g class="chant-4" transform="translate(790, 0)">
      <text x="0" y="0" fill="#C084FC">表裏の間 [FRONT &amp; BACK]</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- HOLLOW PURPLE WAVE / SHOCKWAVE BEAM (CENTER CHANNEL)                      -->
  <!-- ========================================================================= -->
  <!-- Background Static Shockwave Channel -->
  <rect x="30" y="70" width="1120" height="90" rx="12" fill="rgba(147,51,234,0.06)" stroke="rgba(192,132,252,0.2)" stroke-width="1" />

  <!-- Left Origin Orb (Lapse Blue + Reversal Red Core) -->
  <g class="anim-orb">
    <circle cx="75" cy="115" r="32" fill="url(#hollowCore)" filter="url(#waveGlow)" />
    <circle cx="75" cy="115" r="42" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6 3" />
    <circle cx="75" cy="115" r="14" fill="#FFFFFF" />
  </g>

  <!-- Traveling Shockwave Surge 1 -->
  <g class="anim-wave-main">
    <ellipse cx="0" cy="115" rx="160" ry="38" fill="url(#purpleBeam)" filter="url(#waveGlow)" />
    <line x1="-120" y1="115" x2="120" y2="115" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Traveling Shockwave Surge 2 (Trailing Light Pulse) -->
  <g class="anim-wave-fast">
    <ellipse cx="0" cy="115" rx="100" ry="22" fill="url(#purpleBeam)" opacity="0.8" />
  </g>

  <!-- Hollow Purple 200% Unleashed Badge (Right Align) -->
  <g transform="translate(860, 100)">
    <rect width="260" height="30" rx="15" fill="rgba(10,6,26,0.9)" stroke="#C084FC" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#C084FC">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#FFFFFF" font-size="12" font-weight="800" class="font-mono">虚式「茈」 HOLLOW PURPLE 200%</text>
  </g>

  <!-- Bottom Coordinates / Status -->
  <g class="font-mono" transform="translate(40, 198)" font-size="11" fill="rgba(255,255,255,0.4)">
    <text x="0" y="0">INCANTATION: COMPLETE</text>
    <text x="350" y="0">TARGET: GITHUB CONTRIBUTION MATRIX</text>
    <text x="1100" y="0" text-anchor="end" fill="#00F0FF">STATUS: UNSTOPPABLE</text>
  </g>
</svg>